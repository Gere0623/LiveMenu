<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR.js - Pulsante AR Personalizzato</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jeromeetienne/ar.js/aframe/build/aframe-ar.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    a-scene {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    #custom-ar-button {
      position: absolute;
      bottom: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    #custom-ar-button:hover {
      background-color: #0056b3;
    }

    #pulsante{
      background-color: red;
      height: 100px;
      width: 100px;
      border-radius: 10%;
    }

    
  </style>
</head>
<body>

  <div id="pulsante" onclick="aggiuntaAR()"></div>

  

  

  <script defer>
    
    // Rimuove tutti i pulsanti AR e VR standard
    const arButton = document.querySelector('.a-enter-ar-button');
    const vrButton = document.querySelector('.a-enter-vr-button');
    if (arButton) arButton.remove(); // Rimuove il pulsante AR standard
    if (vrButton) vrButton.remove(); // Rimuove il pulsante VR standard


    /*
    // Pulsante personalizzato per avviare AR
    const customArButton = document.getElementById('custom-ar-button');
    customArButton.addEventListener('click', () => {
      // Simula il clic sul pulsante AR standard (che AR.js gestisce internamente)
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl) sceneEl.enterAR();
    });*/
    
    

    
    

    let pulsante = document.getElementById('pulsante');
    

    function aggiuntaAR(){
      
      // Rimuovi il pulsante
      pulsante.style.display = 'none';

      let custom_button = document.createElement('custom-ar-button');
      custom_button.setAttribute('id', 'custom-ar-button'); 
      custom_button.innerHTML = "visualizza in 3D";


      // Crea dinamicamente la scena AR
      let scene = document.createElement('a-scene');
      scene.setAttribute('embedded', '');
      scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false; trackingMethod: best;');

      // Aggiungi il modello 3D
      const entity = document.createElement('a-entity');
      entity.setAttribute('gltf-model', 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Avocado/glTF-Binary/Avocado.glb');
      entity.setAttribute('position', '0 0.75 -0.5');
      entity.setAttribute('scale', '4 4 4');
      entity.setAttribute('rotation', '0 0 0');
      scene.appendChild(entity);

      // Aggiungi la telecamera
      const camera = document.createElement('a-entity');
      camera.setAttribute('camera', '');
      scene.appendChild(camera);


      document.body.appendChild(custom_button);

      // Aggiungi la scena al body
      document.body.appendChild(scene);
    }


  </script>

</body>
</html>
