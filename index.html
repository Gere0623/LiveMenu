<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR.js - Visualizzazione di un Piatto</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jeromeetienne/ar.js/aframe/build/aframe-ar.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    a-scene {
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
    
    <!-- Modello 3D del piatto di cibo -->
    <a-entity
      gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Avocado/glTF-Binary/Avocado.glb"
      position="0 0.85 -0.5"
      scale="3 3 3" 
      rotation="0 0 0">
    </a-entity>

    <!-- Telecamera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
