<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avocado</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jeromeetienne/ar.js/aframe/build/aframe-ar.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #ar-button {
            position: absolute;
            bottom: 25vh;
            left: 50%;
            padding: 20px 25px;
            background-color: #007BFF;
            color: white;
            font-size: 1.7em;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: translate(-50%, 0);
            transition-duration: 0.2s;
        }

        #button-container {
            user-select: none;
            position: absolute;
            left: 0px;
            top: 0px;
            padding: 10px 3% 10px 3%;
            width: 100%;
            background-color: #00000053;
            color: white;
            font-size: 1.7em;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            justify-content: space-between;

        }

        #go-back-button {
            background-color: rgba(0, 0, 0, 0.315);
            display: flex;
            padding: 7px;
            border-radius: 10px;
            color: white;
            font-size: 1em;
            border: none;
            transition-duration: 0.2s;
            align-items: center;

        }

        #go-back-button:active {
            background-color: #0000008d;
        }

        #ar-button:active {
            background-color: #0056b3;
        }

        a{
            text-decoration: none;
        }


        #ingredienti{
            background-image: linear-gradient(rgba(0, 0, 0, 0), rgba(255, 255, 255, 0.229));
            position: absolute;
            margin: 0;
            padding: 0;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 0px;
            width: 100%;
            height: 24vh;
            overflow: scroll;
        }


        .a-enter-ar-button,
        .a-enter-vr-button {
            display: none;
        }

        .ingrediente_item{
            background-color: rgba(255, 255, 255, 0.541);
            display: flex;
            flex-direction: row;
            padding: 10px;
            margin: 5px;
            border-radius: 20px;
            justify-content: space-between;
        }

        ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .immagine_ingrediente{
            border-radius: 20px;
            width: 25%;
        }

        .testo_ingrediente{
            font-weight: 700;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            margin: 0;
        }

        .rimuovi{
            background-color: rgb(232, 53, 53);
            border: none;
            border-radius: 10px;
        }

        .aggiungi{
            background-color: rgb(68, 232, 53);
            border: none;
            border-radius: 10px;
        }

        .scelta_ingrediente{
            align-items: center;
        }

        .rimuovi, .aggiungi{
            padding: 15px;
            margin: 2px;
        }

        .icona_svg{
            height: 1.5em;
        }

        #button_allergeni{
            background-color: rgba(0, 0, 0, 0.315);
            display: flex;
            padding: 7px 15px;
            border-radius: 10px;
            color: white;
            font-size: 1em;
            border: none;
            transition-duration: 0.2s;
        }

        p {
            margin: 0;
        }

    </style>
</head>

<body>

    <!-- Pulsante avviare l'AR -->
    <button id="ar-button">Avvia AR</button>

    
    <div id="button-container">

        <!-- Pulsante per tornare al menu -->
        <a href="../../index.html">
            <button id="go-back-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
                    class="bi bi-caret-left-fill" viewBox="0 0 16 16" style="margin-right: 4px;">
                    <path d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
                </svg>
                <span style="margin-right: 7px;">Menu</span>
            </button>
        </a>

        <button id="button_allergeni">
            <p>Allergeni</p>
        </button>
    </div>

    <div id="ingredienti">
        <ul>


            <li class="ingrediente_item">
                <div style="display: flex;">
                    <img src="imgs/caffe.jpg" alt="caffe" class="immagine_ingrediente">
                    <p class="testo_ingrediente" style="margin-left: 0.5em;">caffe</p>
                </div>
                
                <div class="scelta_ingrediente" style="display: flex;">
                    
                    <button class="rimuovi" onclick="">
                        <img src="imgs/rimuovi.svg" alt="rimuovi" class="icona_svg">
                    </button>

                    <button class="aggiungi" onclick="">
                        <img src="imgs/aggiungi.svg" alt="rimuovi" class="icona_svg">
                    </button>             
                </div>
            </li>

            <li class="ingrediente_item">
                <div style="display: flex;">
                    <img src="imgs/caffe.jpg" alt="caffe" class="immagine_ingrediente">
                    <p class="testo_ingrediente" style="margin-left: 0.5em;">caffe</p>
                </div>
                
                <div class="scelta_ingrediente" style="display: flex;">
                    
                    <button class="rimuovi" onclick="">
                        <img src="imgs/rimuovi.svg" alt="rimuovi" class="icona_svg">
                    </button>

                    <button class="aggiungi" onclick="">
                        <img src="imgs/aggiungi.svg" alt="rimuovi" class="icona_svg">
                    </button>             
                </div>
            </li>

            <li class="ingrediente_item">
                <div style="display: flex;">
                    <img src="imgs/caffe.jpg" alt="caffe" class="immagine_ingrediente">
                    <p class="testo_ingrediente" style="margin-left: 0.5em;">caffe</p>
                </div>
                
                <div class="scelta_ingrediente" style="display: flex;">
                    
                    <button class="rimuovi" onclick="">
                        <img src="imgs/rimuovi.svg" alt="rimuovi" class="icona_svg">
                    </button>

                    <button class="aggiungi" onclick="">
                        <img src="imgs/aggiungi.svg" alt="rimuovi" class="icona_svg">
                    </button>             
                </div>
            </li>

            


        </ul>
    </div>

    <!-- Scena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

        <!-- Modello 3D -->
        <a-entity
            gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Avocado/glTF-Binary/Avocado.glb"
            position="0 0.8.5 -0.5" scale="4 4 4" rotation="0 0 0">
        </a-entity>

        <!-- Telecamera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        
        // comportamento del pulsante AR
        const arButton = document.getElementById('ar-button');
        arButton.addEventListener('click', () => {
            // Simula il clic sul pulsante AR standard
            const arButton = document.querySelector('.a-enter-ar-button');
            if (arButton) {
                arButton.click();
            }
        });
    </script>

</body>

</html>
