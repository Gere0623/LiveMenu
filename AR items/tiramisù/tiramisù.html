<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tiramisù</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jeromeetienne/ar.js/aframe/build/aframe-ar.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #ar-button {
            position: absolute;
            bottom: 25vh;
            left: 50%;
            padding: 20px 25px;
            background-color: #007BFF;
            color: white;
            font-size: 1.7em;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: translate(-50%, 0);
            transition-duration: 0.2s;
        }

        #button-container {
            user-select: none;
            position: absolute;
            left: 0px;
            top: 0px;
            padding: 10px 3% 10px 3%;
            width: 100%;
            background-color: #f8f9fa97;
            color: white;
            font-size: 1.7em;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1;
            display: flex;
            justify-content: space-between;

        }

        #go-back-button {
            background-color: rgba(255, 255, 255, 0.873);
            display: flex;
            padding: 7px;
            border-radius: 10px;
            color: rgb(30, 30, 30);
            font-size: 1em;
            border: none;
            transition-duration: 0.2s;
            align-items: center;
            font-weight: bold;

        }

        #go-back-button:active {
            background-color: #7979798d;
        }

        #ar-button:active {
            background-color: #0056b3;
        }

        a{
            text-decoration: none;
        }


        #ingredienti{
            background-image: linear-gradient(rgba(0, 0, 0, 0), rgba(255, 255, 255, 0.229));
            position: absolute;
            margin: 0;
            padding: 0;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 0px;
            width: 100%;
            height: 24vh;
            overflow: scroll;
        }


        .a-enter-ar-button,
        .a-enter-vr-button {
            display: none;
        }

        .ingrediente_item{
            background-color: rgba(255, 255, 255, 0.741);
            display: flex;
            flex-direction: row;
            padding: 5px;
            margin: 5px;
            border-radius: 20px;
            justify-content: space-between;
        }

        ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .immagine_ingrediente{
            border-radius: 1em;
            width: 25%;
        }

        .testo_ingrediente{
            font-weight: 700;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            margin: 0;
        }

        .rimuovi{
            background-color: rgb(232, 53, 53);
            border: none;
            border-radius: 10px;
        }

        .aggiungi{
            background-color: rgb(68, 232, 53);
            border: none;
            border-radius: 10px;
        }

        .scelta_ingrediente{
            align-items: center;
        }

        .rimuovi, .aggiungi{
            padding: 15px;
            margin: 2px;
            transition-duration: 0.2s;
        }

        .icona_svg{
            height: 1.5em;
        }

        #button_allergeni{
            background-color: rgba(255, 255, 255, 0.873);
            display: flex;
            padding: 7px 15px;
            border-radius: 10px;
            color: rgb(30, 30, 30);
            font-weight: bold;
            font-size: 1em;
            border: none;
            transition-duration: 0.2s;
        }

        p {
            margin: 0;
        }

        .rimuovi:active{
            background-color: darkred;
        }

        .aggiungi:active{
            background-color: darkgreen;
        }

        .deselected{
            opacity: 0.2;
        }

        #pop_up_allergeni{
            display: none;
            flex-direction: column;
            align-items: stretch;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 25% 5% 5% 5%;
            z-index: 2;
        }


        #pop_up_allergeni_nest{
            border-radius: 30px;
            padding: 5%;
            background-color: rgba(255, 255, 255, 0.725);
            transition-duration: 0.5s;
            
            color: rgb(0, 0, 0);
            font-size: 1.4em;
            font-weight: 600;
        }

    </style>
</head>

<body>

    <!-- Pulsante avviare l'AR -->
    <button id="ar-button">Avvia AR</button>

    
    <div id="button-container">

        <!-- Pulsante per tornare al menu -->
        <a href="../../index.html">
            <button id="go-back-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
                    class="bi bi-caret-left-fill" viewBox="0 0 16 16" style="margin-right: 4px;">
                    <path d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
                </svg>
                <span style="margin-right: 7px;">Menu</span>
            </button>
        </a>

        <button id="button_allergeni" onclick="mostra_allergeni()">
            <p>Allergeni</p>
        </button>
    </div>

    <div id="pop_up_allergeni" onclick="nascondi_allergeni()">
        <div id="pop_up_allergeni_nest">
        <ul id="lista_allergeni">
            </ul>
        </div>
    </div>

    <div id="ingredienti">
        <ul>

            

            


        </ul>
    </div>

    <!-- Scena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

        <!-- Modello 3D -->
        <a-entity
            gltf-model="tiramisù.glb"
            position="0 0.85 -0.4" scale="0.3 0.3 0.3" rotation="0 180 0">
        </a-entity>

        <!-- Telecamera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script defer>
        
        function equalsIgnoreCase(string1, string2) {
            return string1.toLowerCase() === string2.toLowerCase();
        }

        const arButton = document.getElementById('ar-button');
        arButton.addEventListener('click', () => {
            const arButton = document.querySelector('.a-enter-ar-button');
            if (arButton) {
                arButton.click();
            }
        });


        let allergeni_visibili = false;

        function mostra_allergeni(){
            allergeni_visibili = true;
            document.getElementById("pop_up_allergeni").style.display = "flex";
        }

        function nascondi_allergeni(){
            allergeni_visibili = false;
            document.getElementById("pop_up_allergeni").style.display = "none";
        }

        let selected_ingredient = [  ];

        let ingredienti = document.querySelectorAll(".ingrediente_item");







        
        /// PER MODIFICARE GLI ALLERGENI ///


        let lista_allergeni_base = ["Glutine", "Uova", "Lattosio"];
        let lista_allergeni = [  ];





        function update_allergeni(){
            
            for(let i = 0; i < selected_ingredient.length; i++){
                for(let j = 0; j < lista_allergeni.length; j++){
                    if(equalsIgnoreCase(selected_ingredient[i].nome, lista_allergeni[j].ingrediente) && selected_ingredient[i].scelto){
                        lista_allergeni[j].scelto = true;
                    }
                    else if(equalsIgnoreCase(selected_ingredient[i].nome, lista_allergeni[j].ingrediente) && !selected_ingredient[i].scelto){
                        lista_allergeni[j].scelto = false;
                    }
                    else{

                    }
                }
            }

            let lista_allergeni_item = document.getElementById("lista_allergeni");

            lista_allergeni_item.innerHTML = "";

            for(let i = 0; i < lista_allergeni_base.length; i++){
                let nuovo_item = document.createElement("li");
                nuovo_item.innerHTML = lista_allergeni_base[i];
                lista_allergeni_item.appendChild(nuovo_item);
            }

            for(let i = 0; i < lista_allergeni.length; i++){
                if(lista_allergeni[i].scelto){
                    let nuovo_item = document.createElement("li");
                    nuovo_item.innerHTML = lista_allergeni[i].nome;
                    lista_allergeni_item.appendChild(nuovo_item);
                }   
            }
        }

        update_allergeni();
        


        


        

        


        

        for (let i = 0; i < selected_ingredient.length; i++) {
            if(selected_ingredient[i].scelto){
                ingredienti[i].getElementsByClassName("scelta_ingrediente")[0].getElementsByClassName("rimuovi")[0].classList.remove("deselected");

                ingredienti[i].getElementsByClassName("scelta_ingrediente")[0].getElementsByClassName("aggiungi")[0].classList.add("deselected");
            }
            else{
                ingredienti[i].getElementsByClassName("scelta_ingrediente")[0].getElementsByClassName("rimuovi")[0].classList.add("deselected");

                ingredienti[i].getElementsByClassName("scelta_ingrediente")[0].getElementsByClassName("aggiungi")[0].classList.remove("deselected");
            }
        }

        function aggiungiIngrediente(button){

            if(!button.classList.contains("deselected")){

                for(let i = 0; i < selected_ingredient.length; i++){

                    if(equalsIgnoreCase(button.parentNode.parentNode.id, selected_ingredient[i].nome)){
                        
                        selected_ingredient[i].scelto = true;

                        button.classList.add("deselected");
                        button.previousElementSibling.classList.remove("deselected");
                    }    
                }

            }

            update_allergeni();
        }

        function rimuoviIngrediente(button){
            
            if(!button.classList.contains("deselected")){
                
                for(let i = 0; i < selected_ingredient.length; i++){

                    if(equalsIgnoreCase(button.parentNode.parentNode.id, selected_ingredient[i].nome)){
                        selected_ingredient[i].scelto = false;

                        button.classList.add("deselected");
                        button.nextElementSibling.classList.remove("deselected");
                    }    
                }

            }

            update_allergeni();
        }



        


    </script>

</body>

</html>
